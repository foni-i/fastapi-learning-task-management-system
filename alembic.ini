# Alembic configuration for the FastAPI STMS migration environment.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# The database URL deliberately does not live in this file. alembic/env.py
# obtains STMS_DATABASE_URL from the application's typed settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
