[project]
name = "fastapi-stms"
version = "0.1.0"
description = "A learning task management API built with FastAPI"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.17,<2.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
